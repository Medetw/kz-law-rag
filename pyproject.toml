[project]
name = "kz-law-rag"
version = "0.1.0"
description = "RAG assistant over the tax and labour codes of Kazakhstan (RU/KZ) with article-level citations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Medet Zhumakhan" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "numpy>=1.26",
    "snowballstemmer>=2.2",
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "openai>=1.50",
    "langfuse>=3.0",
    "mcp>=1.9",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "huggingface-hub>=0.26",
]

[project.scripts]
kzlaw = "kzlaw.cli:main"
kzlaw-mcp = "kzlaw.mcp_server:main"

[dependency-groups]
# Local embedding + reranking models. Not needed for unit tests / CI (they use a hashing embedder).
ml = [
    "sentence-transformers>=3.3",
    "torch>=2.5",
]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kzlaw"]

[tool.uv]
default-groups = ["dev", "ml"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "DTZ", "S", "ASYNC", "PT", "T20"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Cyrillic / Kazakh text in strings and comments is intended
    "N812",  # `from kzlaw import tools as T`
]

[tool.ruff.lint.isort]
known-first-party = ["kzlaw"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]
"evals/**" = ["T20", "S101"]
"src/kzlaw/cli.py" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["kzlaw"]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "pgvector.*", "snowballstemmer.*", "torch.*", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["db: needs a running PostgreSQL with pgvector (DATABASE_URL)"]
